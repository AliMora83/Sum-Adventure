# Netlify build configuration.
#
# Replaces Vercel as of Sprint 8. Vercel was cancelled; nothing about the
# application code changed in this sprint, only where it builds.
#
# `publish = ".next"` is correct for a Next.js site on Netlify: the Next.js
# runtime (@netlify/plugin-nextjs) is installed automatically when Netlify
# detects Next.js in package.json, and it reads the build output from .next.
# It is deliberately not "out" — there is no `output: "export"` in
# next.config.ts, so `next build` never writes an out/ directory.
#
# NODE_VERSION is pinned rather than left to Netlify's default so the build
# image matches the version this repo is developed and verified against.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "25"
